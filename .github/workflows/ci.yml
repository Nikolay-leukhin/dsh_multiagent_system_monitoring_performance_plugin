name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Сборка клиентского бандла
        run: npm run build
      - name: Тесты
        run: npm test
      - name: Проверка формата пакета
        run: npm run check
      - name: Пакет не разошёлся с исходниками
        run: git diff --exit-code -- lib/client.js
